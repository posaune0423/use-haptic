name: Publish NPM

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository 🔔
        uses: actions/checkout@v4

      - name: Setup Deno 🦕
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Extract version from deno.json 🏷️
        id: get_version
        run: |
          VERSION=$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('deno.json').replace(/\\/\\/.*/g, '')).version)")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version extracted: $VERSION"

      - name: Check npm version availability 🔎
        id: npm_version
        run: |
          if npm view "use-haptic@${VERSION}" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} already exists on npm. Skipping publish."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build npm package 🔨
        if: steps.npm_version.outputs.should_publish == 'true'
        run: deno run -A scripts/build_npm.ts ${{ env.VERSION }}

      - name: Setup Node.js 🔧
        if: steps.npm_version.outputs.should_publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm 🎁
        if: steps.npm_version.outputs.should_publish == 'true'
        run: |
          cd npm
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
